name: bond-trading

on:
  push:
    branches: ["**"]
    paths: ["bond-trading/**", ".github/workflows/bond-trading.yml"]
  schedule:
    - cron: "40 7 * * 1-5"        # 10:40 МСК по будням: ежедневный отчёт (рынок открыт с 09:50, новости и рейтинги свежие)
    - cron: "*/10 6-16 * * 1-5"   # каждые 10 минут 09:00–19:59 МСК по будням: ответы бота на кнопки/команды
  workflow_dispatch:
    inputs:
      daily:
        description: "Ежедневный отчёт (новости, алерты, целевой портфель, Telegram)"
        type: boolean
        default: false
      telegram_setup:
        description: "Только показать chat_id тех, кто писал боту (для секрета TELEGRAM_CHAT_ID)"
        type: boolean
        default: false
      bot:
        description: "Бот: ответить на накопившиеся нажатия кнопок/команды сейчас"
        type: boolean
        default: false
      bot_menu:
        description: "Бот: дополнительно прислать справку с кнопками"
        type: boolean
        default: false
      lookup:
        description: "Почему бумага (не) в скрине: часть названия эмитента, SECID или ISIN (напр. НЛМК)"
        type: string
        default: ""
      cmd:
        description: "Произвольная команда bondtrader под профилем hy (напр. signals -s gspread -p top_n=10)"
        type: string
        default: ""
      strategy:
        description: "Стратегия для песочницы"
        type: choice
        default: carry
        options: [carry, value_hy, gspread, ladder, rate_cycle, spread]
      profile:
        description: "Профиль настроек для песочницы"
        type: choice
        default: default
        options: [default, moderate, hy]
      execute:
        description: "Реально отправить ордера в песочницу (иначе только dry-run)"
        type: boolean
        default: false
      backtest:
        description: "Сравнительный бэктест стратегий 2023–2025"
        type: boolean
        default: false
      smoke:
        description: "Живой прогон MOEX + ЦБ + рейтинги + новости (долгий, ~35 мин; иначе только по push в main)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: bond-trading

jobs:
  test:
    name: Тесты (офлайн, фикстуры)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule == '40 7 * * 1-5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bond-trading/requirements.txt
      - run: pip install -e ".[dev]"
      - run: pytest -q

  live-smoke:
    name: Живой прогон MOEX + ЦБ
    runs-on: ubuntu-latest
    needs: test
    # долгий job (~35 мин): только по push в main, по ежедневному расписанию или по явной галочке smoke —
    # иначе каждый push/разовая команда сжигали по 35 минут лимита Actions
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'schedule' && github.event.schedule == '40 7 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.smoke)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bond-trading/requirements.txt
      - run: pip install -e .
      - name: Ключевая ставка ЦБ
        run: bondtrader keyrate -v
      - name: Кривая ОФЗ
        run: bondtrader curve -v
      - name: Скринер
        run: bondtrader screen --top 25 -v
      - name: Карточка ОФЗ 26238 с графиком
        run: bondtrader bond SU26238RMFS4 --schedule -v
      - name: Разведка сайтов рейтинговых агентств (формы, пагинация, ajax)
        continue-on-error: true
        run: bondtrader ratings discover --deep
      - name: Отчётность и факты — что доступно из CI (ГИР БО/e-disclosure геоблокированы, ожидаем понятный отказ)
        continue-on-error: true
        run: |
          python -c "from bondtrader.data.moex import MoexClient; d=MoexClient().security_description('RU000A1038M5'); print('ISS description keys:', sorted(d)); print({k:v for k,v in d.items() if 'INN' in k.upper() or 'EMITTER' in k.upper() or 'NAME' in k.upper()})"
          bondtrader financials fetch --query 7826705374 || true
          bondtrader disclosure discover --query "Балтийский лизинг" || true
      - name: Новостной фон — источники и разбор
        continue-on-error: true
        run: bondtrader news discover --query "Балтийский лизинг"
      - name: Книги новостей/отчётности из предыдущих прогонов (кэш)
        uses: actions/cache@v4
        with:
          path: |
            bond-trading/data/news.csv
            bond-trading/data/financials.csv
            bond-trading/data/issuers.csv
            bond-trading/data/disclosure.csv
          key: books-${{ github.run_id }}
          restore-keys: |
            books-
            daily-books-
            credit-books-
      - name: Книга рейтингов из предыдущих прогонов (кэш)
        uses: actions/cache@v4
        with:
          path: bond-trading/data/ratings.csv
          key: ratings-csv-${{ github.run_id }}
          restore-keys: ratings-csv-
      - name: Рейтинги НКР + Эксперт РА + АКРА -> data/ratings.csv (накопительно), покрытие скрина
        continue-on-error: true
        run: |
          bondtrader ratings fetch -v 2>&1 | grep -v DEBUG
          bondtrader ratings coverage | head -70
          bondtrader -c configs/hy.yaml screen --top 30
      - name: Новости по эмитентам ВДО-скрина -> data/news.csv; покрытие отчётностью; целевой портфель value_hy
        continue-on-error: true
        run: |
          bondtrader -c configs/hy.yaml news fetch --from-screen --general 2>&1 | tail -60
          bondtrader -c configs/hy.yaml news list --negative --top 30
          bondtrader -c configs/hy.yaml financials coverage | head -50
          bondtrader -c configs/hy.yaml disclosure list --kind default tech_default restructuring | head -30
          bondtrader -c configs/hy.yaml spreads --top 40 --bottom 10
          bondtrader -c configs/hy.yaml screen --top 40 -v 2>&1 | grep -v DEBUG
          bondtrader -c configs/hy.yaml signals
      - uses: actions/upload-artifact@v4
        with:
          name: credit-books
          path: |
            bond-trading/data/ratings.csv
            bond-trading/data/news.csv
            bond-trading/data/financials.csv
            bond-trading/data/issuers.csv
            bond-trading/data/disclosure.csv
          if-no-files-found: ignore
      - name: Сигналы стратегий
        run: |
          bondtrader signals -s carry
          bondtrader signals -s rate_cycle
          bondtrader signals -s ladder
          bondtrader signals -s spread
      - name: Бэктест (короткий, явная вселенная ОФЗ)
        run: bondtrader backtest -s ladder --start 2024-01-10 --end 2024-12-30 --universe SU26207RMFS9,SU26224RMFS4,SU26238RMFS4,SU26244RMFS2 --rebalance monthly --trades -v

  telegram-setup:
    name: Telegram — chat_id
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.telegram_setup
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: bondtrader notify --whoami
      - name: Тестовое сообщение (если chat_id уже задан)
        if: env.TELEGRAM_CHAT_ID != ''
        run: bondtrader notify --text "bondtrader - уведомления настроены"

  daily:
    name: Ежедневный отчёт (расписание 10:40 МСК; профиль hy)
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.event.schedule == '40 7 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.daily)
    env:
      TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BONDTRADER_CONFIG: configs/hy.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Сертификаты УЦ Минцифры (T-Invest)
        if: env.TINVEST_TOKEN != ''
        run: |
          set -e
          cp "$(python -m certifi)" /tmp/ca-bundle.pem
          for name in russian_trusted_root_ca russian_trusted_sub_ca; do
            curl -sSfLo /tmp/$name.raw "https://gu-st.ru/content/lending/${name}_pem.crt"
            if grep -q "BEGIN CERTIFICATE" /tmp/$name.raw; then openssl x509 -in /tmp/$name.raw -inform PEM -out /tmp/$name.pem; else openssl x509 -in /tmp/$name.raw -inform DER -out /tmp/$name.pem; fi
            printf '\n' >> /tmp/ca-bundle.pem; cat /tmp/$name.pem >> /tmp/ca-bundle.pem
          done
          echo "TINVEST_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Книги (кэш) — рейтинги, новости, отчётность, факты
        uses: actions/cache@v4
        with:
          path: |
            bond-trading/data/ratings.csv
            bond-trading/data/news.csv
            bond-trading/data/financials.csv
            bond-trading/data/issuers.csv
            bond-trading/data/disclosure.csv
          key: books-${{ github.run_id }}
          restore-keys: |
            books-
            daily-books-
            credit-books-
      - name: Рейтинги (обновление, накопительно; АКРА — только свежие пресс-релизы)
        continue-on-error: true
        run: bondtrader ratings fetch --pages 8 2>&1 | tail -3
      - name: Новости по эмитентам скрина
        continue-on-error: true
        run: bondtrader news fetch --from-screen --general 2>&1 | tail -5
      - name: Отчёт (бумажный портфель или песочница T-Invest)
        run: |
          if [ -n "$TINVEST_TOKEN" ]; then BR="--broker tinvest"; else BR=""; fi
          bondtrader report $BR --md report.md --tg-file report_tg.html > /dev/null
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          bondtrader monitor $BR --strict || echo "::warning::есть критические алерты по позициям — см. отчёт"
      - name: Telegram — chat_id (если секрет TELEGRAM_CHAT_ID ещё не задан)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID == ''
        continue-on-error: true
        run: bondtrader notify --whoami
      - name: Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        run: bondtrader notify --file report_tg.html --html --menu
      - uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            bond-trading/report.md
            bond-trading/data/news.csv
            bond-trading/data/ratings.csv
          if-no-files-found: ignore

  bot:
    name: Telegram-бот — ответы на кнопки (каждые 10 минут в торговые часы)
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.event.schedule == '*/10 6-16 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.bot)
    concurrency: telegram-bot
    env:
      TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BONDTRADER_CONFIG: configs/hy.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Проверка секретов
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::error::нужны секреты TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID"; exit 1; fi
      - name: Смещение обновлений Telegram (кэш) — чтобы не отвечать дважды
        uses: actions/cache@v4
        with:
          path: bond-trading/state/telegram_offset.json
          key: tg-offset-${{ github.run_id }}
          restore-keys: tg-offset-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bond-trading/requirements.txt
      - run: pip install -e .
      - name: Сертификаты УЦ Минцифры (T-Invest)
        if: env.TINVEST_TOKEN != ''
        run: |
          set -e
          cp "$(python -m certifi)" /tmp/ca-bundle.pem
          for name in russian_trusted_root_ca russian_trusted_sub_ca; do
            curl -sSfLo /tmp/$name.raw "https://gu-st.ru/content/lending/${name}_pem.crt"
            if grep -q "BEGIN CERTIFICATE" /tmp/$name.raw; then openssl x509 -in /tmp/$name.raw -inform PEM -out /tmp/$name.pem; else openssl x509 -in /tmp/$name.raw -inform DER -out /tmp/$name.pem; fi
            printf '\n' >> /tmp/ca-bundle.pem; cat /tmp/$name.pem >> /tmp/ca-bundle.pem
          done
          echo "TINVEST_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Книги (кэш) — рейтинги, новости, отчётность, факты
        uses: actions/cache/restore@v4
        with:
          path: |
            bond-trading/data/ratings.csv
            bond-trading/data/news.csv
            bond-trading/data/financials.csv
            bond-trading/data/issuers.csv
            bond-trading/data/disclosure.csv
          key: books-none
          restore-keys: |
            books-
            daily-books-
            credit-books-
      - name: Ответить на накопившиеся нажатия и команды
        run: |
          if [ -n "$TINVEST_TOKEN" ]; then BR="--broker tinvest"; else BR=""; fi
          MENU=""; if [ "${{ inputs.bot_menu }}" = "true" ]; then MENU="--menu"; fi
          bondtrader bot $BR $MENU

  lookup:
    name: Разовая команда под профилем hy (lookup / cmd)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.lookup != '' || inputs.cmd != '')
    env:
      BONDTRADER_CONFIG: configs/hy.yaml
      LOOKUP: ${{ inputs.lookup }}
      CMD: ${{ inputs.cmd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bond-trading/requirements.txt
      - run: pip install -e .
      - name: Книги (кэш) — рейтинги, новости, отчётность, факты
        uses: actions/cache/restore@v4
        with:
          path: |
            bond-trading/data/ratings.csv
            bond-trading/data/news.csv
            bond-trading/data/financials.csv
            bond-trading/data/issuers.csv
            bond-trading/data/disclosure.csv
          key: books-none
          restore-keys: |
            books-
            daily-books-
            credit-books-
      - name: Выпуски и статус в скрине
        if: env.LOOKUP != ''
        run: |
          set -o pipefail
          bondtrader why "$LOOKUP" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Команда
        if: env.CMD != ''
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          bondtrader $CMD | tee -a "$GITHUB_STEP_SUMMARY"

  sandbox:
    name: Песочница T-Invest (ручной запуск, нужен секрет TINVEST_TOKEN)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && !inputs.bot && !inputs.telegram_setup && !inputs.smoke && !inputs.daily && inputs.lookup == '' && inputs.cmd == ''
    env:
      TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
      BONDTRADER_CONFIG: ${{ inputs.profile == 'default' && 'config.yaml' || format('configs/{0}.yaml', inputs.profile) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Проверка секрета
        run: |
          if [ -z "$TINVEST_TOKEN" ]; then echo "::error::секрет TINVEST_TOKEN не задан (Settings → Secrets and variables → Actions)"; exit 1; fi
      - name: Сертификаты УЦ Минцифры для хостов tinkoff.ru
        run: |
          set -e
          cp "$(python -m certifi)" /tmp/ca-bundle.pem
          for name in russian_trusted_root_ca russian_trusted_sub_ca; do
            curl -sSfLo /tmp/$name.raw "https://gu-st.ru/content/lending/${name}_pem.crt"
            echo "== $name: $(file -b /tmp/$name.raw | cut -c1-60)"
            if grep -q "BEGIN CERTIFICATE" /tmp/$name.raw; then
              openssl x509 -in /tmp/$name.raw -inform PEM -out /tmp/$name.pem
            else
              openssl x509 -in /tmp/$name.raw -inform DER -out /tmp/$name.pem
            fi
            openssl x509 -in /tmp/$name.pem -noout -subject -enddate
            printf '\n' >> /tmp/ca-bundle.pem
            cat /tmp/$name.pem >> /tmp/ca-bundle.pem
          done
          python -c "import ssl; c=ssl.create_default_context(); c.load_verify_locations('/tmp/ca-bundle.pem'); print('бандл загружен, сертификатов:', len(c.get_ca_certs()))"
          echo "TINVEST_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Проверка TLS до песочницы
        run: |
          echo | openssl s_client -connect sandbox-invest-public-api.tinkoff.ru:443 -servername sandbox-invest-public-api.tinkoff.ru -CAfile /tmp/ca-bundle.pem 2>/dev/null | grep -E "Verify return code|issuer=|subject=" || true
      - name: Книга рейтингов (кэш)
        uses: actions/cache/restore@v4
        with:
          path: bond-trading/data/ratings.csv
          key: ratings-csv-none
          restore-keys: ratings-csv-
      - name: Книги новостей/отчётности (кэш)
        uses: actions/cache/restore@v4
        with:
          path: |
            bond-trading/data/news.csv
            bond-trading/data/financials.csv
            bond-trading/data/issuers.csv
            bond-trading/data/disclosure.csv
          key: books-none
          restore-keys: |
            books-
            daily-books-
            credit-books-
      - name: Счёт песочницы
        run: bondtrader sandbox-init --amount 1000000
      - name: Портфель до
        run: bondtrader portfolio --broker tinvest
      - name: Ребалансировка по стратегии ${{ inputs.strategy }} (dry-run)
        run: bondtrader trade --broker tinvest -s ${{ inputs.strategy }}
      - name: Ребалансировка (исполнение в песочнице)
        if: inputs.execute
        run: bondtrader trade --broker tinvest -s ${{ inputs.strategy }} --confirm
      - name: Портфель после
        if: inputs.execute
        run: bondtrader portfolio --broker tinvest

  backtest-compare:
    name: Сравнение стратегий 2023–2025 (ручной запуск)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.backtest
    env:
      # ОФЗ-ПД, торговавшиеся на начало 2023 (более поздние выпуски подключаются с даты появления истории)
      OFZ: SU26229RMFS3,SU26207RMFS9,SU26232RMFS7,SU26236RMFS9,SU26224RMFS4,SU26241RMFS8,SU26240RMFS0,SU26238RMFS4,SU26243RMFS4,SU26244RMFS2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: ladder (ОФЗ, корзины 1/2/3/5 лет)
        run: bondtrader -c configs/moderate.yaml backtest -s ladder -p "edges=[1,2,3,5]" -p per_bucket=1 --start 2023-01-10 --end 2025-12-30 --universe "$OFZ"
      - name: rate_cycle (ОФЗ, дюрация по фазе ЦБ)
        run: bondtrader -c configs/moderate.yaml backtest -s rate_cycle -p top_n=3 --start 2023-01-10 --end 2025-12-30 --universe "$OFZ" --trades
      - name: carry (ОФЗ)
        run: bondtrader -c configs/moderate.yaml backtest -s carry -p top_n=4 -p ofz_min_share=1 --start 2023-01-10 --end 2025-12-30 --universe "$OFZ"
      - name: carry (ОФЗ + корпораты из текущего скрина, survivorship bias!)
        run: bondtrader -c configs/moderate.yaml backtest -s carry --start 2023-01-10 --end 2025-12-30 --auto 25 --csv nav_carry.csv
      - name: ВДО — текущий скрин и целевой портфель (configs/hy.yaml)
        run: |
          bondtrader -c configs/hy.yaml screen --top 40
          bondtrader -c configs/hy.yaml signals
      - name: ВДО — бэктест carry (вселенная из текущего скрина, survivorship bias!)
        run: bondtrader -c configs/hy.yaml backtest -s carry --start 2023-01-10 --end 2025-12-30 --auto 40 --csv nav_hy.csv
      - name: Бенчмарки за тот же период (RGBITR — ОФЗ, RUCBITR — корпораты, RUCBHYTR — ВДО)
        run: |
          for ix in RGBITR RUCBITR RUCBHYTR RUCBCPNS; do
            echo "== $ix"; bondtrader -c configs/moderate.yaml backtest -s ladder -p "edges=[100]" --start 2023-01-10 --end 2025-12-30 --universe SU26238RMFS4 --benchmark $ix | grep -E "benchmark_total_return" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-nav
          path: |
            bond-trading/nav_carry.csv
            bond-trading/nav_hy.csv
          if-no-files-found: ignore
