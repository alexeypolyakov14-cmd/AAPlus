name: bond-trading

on:
  push:
    branches: ["**"]
    paths: ["bond-trading/**", ".github/workflows/bond-trading.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: bond-trading

jobs:
  test:
    name: Тесты (офлайн, фикстуры)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bond-trading/requirements.txt
      - run: pip install -e ".[dev]"
      - run: pytest -q

  live-smoke:
    name: Живой прогон MOEX + ЦБ
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bond-trading/requirements.txt
      - run: pip install -e .
      - name: Ключевая ставка ЦБ
        run: bondtrader keyrate -v
      - name: Кривая ОФЗ
        run: bondtrader curve -v
      - name: Скринер
        run: bondtrader screen --top 25 -v
      - name: Карточка ОФЗ 26238 с графиком
        run: bondtrader bond SU26238RMFS4 --schedule -v
      - name: Сигналы стратегий
        run: |
          bondtrader signals -s carry
          bondtrader signals -s rate_cycle
          bondtrader signals -s ladder
          bondtrader signals -s spread
      - name: Бэктест (короткий, явная вселенная ОФЗ)
        run: bondtrader backtest -s ladder --start 2024-01-10 --end 2024-12-30 --universe SU26207RMFS9,SU26224RMFS4,SU26238RMFS4,SU26244RMFS2 --rebalance monthly --trades -v
