# Профиль ВДО (высокодоходные облигации), максимальный риск. Портфель 10–15 млн руб.
# Ключевая идея: доход от спреда, риск — дефолты, поэтому широкая диверсификация и
# отсечение бумаг, в цене которых рынок уже закладывает дефолт.
# Запуск: bondtrader -c configs/hy.yaml signals

data:
  boards: [TQOB, TQCB]
  ratings_csv: data/ratings.csv
  financials_csv: data/financials.csv    # ГИР БО: bondtrader -c configs/hy.yaml financials fetch --from-screen (из РФ)
  issuers_csv: data/issuers.csv
  disclosure_csv: data/disclosure.csv    # e-disclosure: bondtrader -c configs/hy.yaml disclosure fetch --from-screen (из РФ)
  news_csv: data/news.csv                # новости: bondtrader -c configs/hy.yaml news fetch --from-screen (откуда угодно)

screener:
  currency: SUR
  min_ytm: 18                  # ниже — это уже не ВДО
  max_ytm: 45
  min_duration: 0.3
  max_duration: 2.5            # короткие: меньше времени на ухудшение кредита, быстрее оборот
  min_turnover: 2000000        # ≥2 млн руб./день; при позиции ~400 тыс. набор займёт ~4 дня
  max_list_level: 3            # ВДО живут на 3-м уровне
  exclude_floaters: true
  exclude_linkers: true
  max_bid_ask_pct: 1.5
  max_g_spread_bp: 2500        # выше — рынок закладывает дефолт
  min_price: 70                # цена ниже 70 — тоже признак дистресса
  min_rating: B                # ниже B — преддефолт; ВДО живут в BB+…B
  require_rating: false        # пока книга рейтингов неполная — без рейтинга не отсекаем, но ограничиваем долю
  exclude_default_days: 365    # (тех)дефолт/реструктуризация в e-disclosure за год — отсев
  min_fin_score: 0             # балл отчётности (0 — не отсекать; стоп-факторы по капиталу/покрытию работают отдельно)
  require_financials: false    # включить, когда книга отчётности покроет скрин
  news_days: 90
  news_stop_score: -8          # суммарный негатив за 90 дней; одна новость СМИ о дефолте/банкротстве — отсев всегда
  exclude_moex_defaults: true  # флаги дефолта в реестре MOEX (описание бумаги в ISS)

risk:
  max_weight_per_bond: 0.04       # ≈500 тыс. при 12 млн
  max_weight_per_bond_ofz: 0.15
  max_weight_per_issuer: 0.06     # у ВДО-эмитентов часто по 3–5 выпусков
  max_corporate_share: 0.90       # 10% в ОФЗ — подушка ликвидности
  min_portfolio_duration: 0.5
  max_portfolio_duration: 2.5
  max_g_spread_bp: 2000
  min_list_level: 3               # риск-лимиты допускают 3-й уровень (как и скринер), иначе ВДО отсекаются на этапе eligible
  max_turnover_share: 0.05
  yield_vol_bp_daily: 40          # спреды ВДО ходят сильнее ОФЗ
  max_unrated_share: 0.25         # не более четверти портфеля в бумагах без рейтинга
  min_rating: B
  max_sector_share: 0.30          # лизинг/МФО/девелоперы — дефолты кластеризуются по секторам
  fin_hard_stops: true            # отрицательный капитал / покрытие процентов < 1 — не покупаем

strategy:
  name: value_hy                  # недооценённые ВДО; альтернатива — carry (bondtrader -c configs/hy.yaml signals -s carry)
  params:
    top_n: 30                     # 30 позиций: один дефолт ≈ −3% портфеля
    w_spread: 0.40                # остаток спреда к справедливому по срезу рынка
    w_fin: 0.35                   # балл отчётности минус балл, зашитый в рейтинг (0 без отчётности)
    w_ret: 0.25                   # YTW − PD·LGD − издержки ликвидности
    w_news: 0.15                  # новостной фон (0 без новостей)
    lgd: 0.6
    horizon: 1.0
    slippage_bp: 25
    max_duration: 2.5
    ofz_min_share: 0.10
    min_coverage: 1.5             # стоп: покрытие процентов ниже — не берём (если отчётность есть)
  rebalance: monthly

backtest:
  commission_bp: 5
  slippage_bp: 25                 # у ВДО реальное проскальзывание заметно выше
  initial_cash: 12000000
  benchmark: RUCBITR              # индекс корпоративных облигаций полной доходности
  cash_spread_bp: -50          # свободные деньги: ключевая ставка − 0.5 п.п. (фонд ликвидности)

execution:
  broker: paper
  state_path: state/portfolio_hy.json
  journal_path: state/orders_hy.jsonl
  tinvest:
    sandbox: true
    account_id: ""
    token_env: TINVEST_TOKEN
